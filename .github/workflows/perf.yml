# TinyPHP.rt - performance comparison vs native PHP strongest
# Manual-only (workflow_dispatch): benchmarks are noisy on shared runners
# and cost extra minutes; run on demand. tphp strongest state vs PHP
# strongest (opcache.enable_cli=1 + opcache.jit=tracing + 128M buffer).
# Pure-compute benches only (no async/worker - PHP native has neither).
name: Perf

on:
  workflow_dispatch:
    inputs:
      fib_gate:
        description: "fib(28) ratio gate for native x86_64 jobs (0 = report only)"
        required: false
        default: "6.0"

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Windows x86_64 ----------
  windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: mingw-w64-clang-x86_64-clang

      - name: Build (build.cmd via msys2 CLANG64)
        shell: msys2 {0}
        run: |
          which clang
          clang --version
          cmd.exe //c build.cmd

      - name: Setup PHP (opcache + tracing JIT)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=128M

      - name: Perf vs PHP strongest
        shell: pwsh
        run: ./tools/perf-compare.ps1 -Php php -MaxFibRatio ${{ inputs.fib_gate }} -Report perf-vs-php.md

  # ---------- Linux x86_64 ----------
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang binutils libffi-dev

      - name: Build (build.sh)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Setup PHP (opcache + tracing JIT)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=128M

      - name: Perf vs PHP strongest
        shell: pwsh
        run: ./tools/perf-compare.ps1 -Php php -MaxFibRatio ${{ inputs.fib_gate }} -Report perf-vs-php.md

  # ---------- Linux aarch64 ----------
  linux-aarch64:
    name: Linux aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang binutils libffi-dev

      - name: Build (build.sh)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Setup PHP (opcache + tracing JIT)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=128M

      # aarch64 v1: tphp IR JIT disabled (x86_64 only) - report-only
      - name: Perf vs PHP strongest
        shell: pwsh
        run: ./tools/perf-compare.ps1 -Php php -Report perf-vs-php.md

      # P0-19 control arm: same NO_BINS pass as macos-aarch64. Linux ELF
      # TLS (initial-exec) is cheap, so this should be ~neutral vs the
      # run above - any large delta here means the toggle itself is not
      # neutral and the mac discrimination is confounded.
      - name: Perf vs PHP strongest (TPHP_NO_BINS=1, control)
        shell: pwsh
        env:
          TPHP_NO_BINS: "1"
        run: ./tools/perf-compare.ps1 -Php php -Report perf-vs-php-nobins.md

  # ---------- macOS aarch64 (Apple Silicon, native) ----------
  macos-aarch64:
    name: macOS aarch64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # runner profile: CPU model feeds the arm64-mac vs linux-arm
      # comparison (same tphp, gaps there are machine differences)
      - name: Environment (arch/CPU)
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string || true

      - name: Install deps
        run: |
          brew install libffi || true
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Build native arm64 (build.sh)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Setup PHP (opcache + tracing JIT)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=128M

      # aarch64 JIT enabled (2026-10-27). NOTE: macOS runner = M1-class
      # Apple Silicon; gaps vs Linux arm64 (server CPU) are machine
      # differences, not code — e.g. object 32x vs 0.29x is runner skew.
      - name: Perf vs PHP strongest
        shell: pwsh
        run: ./tools/perf-compare.ps1 -Php php -Report perf-vs-php.md

      # P0-19 arm64-mac anomaly discrimination: tphp json/object/throw/
      # logstat 2.3-6.6x slower than SAME-arch aarch64-linux. Leading
      # hypothesis: tphp's own _Thread_local hot vars (g_bins in mem.c)
      # pay Darwin tlv_get_addr per access (mimalloc itself uses pthread
      # direct slots and is NOT affected). TPHP_NO_BINS=1 disables the
      # C bins shim -> alloc-heavy items route through mi_malloc only.
      #   NO_BINS faster than default  -> bins TLS is the tax (fix: fast
      #   TLS slot for g_bins, mirroring mimalloc prim-tls.h)
      #   NO_BINS same/slower          -> tax is elsewhere (gc_list/
      #   opool TLS, class tab, or platform) - iterate from there.
      # alloc-probe item (bench-vs-php.php) provides the PHP-side CPU
      # sanity check (PHP also slow -> runner generation gap, close).
      - name: Perf vs PHP strongest (TPHP_NO_BINS=1, discrimination)
        shell: pwsh
        env:
          TPHP_NO_BINS: "1"
        run: ./tools/perf-compare.ps1 -Php php -Report perf-vs-php-nobins.md

  # ---------- macOS x86_64: cross-compile on arm64 runner ----------
  # REPORT-ONLY by design: arm64 PHP (native) vs x86_64 tphp under
  # Rosetta 2 - arch-mismatched, ratios not comparable. Interpreter
  # threaded dispatch is Rosetta's weak spot (fake 10-50x gaps seen);
  # keep only as a build/run smoke check of the x86_64 codegen.
  macos-x86_64:
    name: macOS x86_64 (cross)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environment (arch/CPU/Rosetta)
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string || true
          sysctl -n sysctl.proc_translated || true

      - name: Install deps
        run: |
          brew install libffi || true
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Cross-compile x86_64 (build.sh TARGET_ARCH=x86_64)
        run: |
          chmod +x build.sh
          TARGET_ARCH=x86_64 ./build.sh

      - name: Verify binary arch
        run: |
          file build/tphp
          file build/tphp | grep -q x86_64

      - name: Setup PHP (opcache + tracing JIT)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=128M

      # cross-arch (arm64 PHP native vs x86_64 tphp under Rosetta) - report-only
      - name: Perf vs PHP strongest
        shell: pwsh
        run: ./tools/perf-compare.ps1 -Php php -Report perf-vs-php.md
