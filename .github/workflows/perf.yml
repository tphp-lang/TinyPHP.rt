# TinyPHP.rt - performance comparison vs native PHP strongest
# Manual-only (workflow_dispatch): benchmarks are noisy on shared runners
# and cost extra minutes; run on demand. tphp strongest state vs PHP
# strongest (opcache.enable_cli=1 + opcache.jit=tracing + 128M buffer).
# Pure-compute benches only (no async/worker - PHP native has neither).
name: Perf

on:
  workflow_dispatch:
    inputs:
      fib_gate:
        description: "fib(28) ratio gate for native x86_64 jobs (0 = report only)"
        required: false
        default: "6.0"

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Windows x86_64 ----------
  windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: mingw-w64-clang-x86_64-clang

      - name: Build (build.cmd via msys2 CLANG64)
        shell: msys2 {0}
        run: |
          which clang
          clang --version
          cmd.exe //c build.cmd

      - name: Setup PHP (opcache + tracing JIT)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=128M

      - name: Perf vs PHP strongest
        shell: pwsh
        run: ./tools/perf-compare.ps1 -Php php -MaxFibRatio ${{ inputs.fib_gate }} -Report perf-vs-php.md

      # One-file handoff: bundle this job's report (+ extra logs) so the
      # whole run can be passed to the analysis session as ONE artifact
      # (collect-report merges everything into perf-report-all.md).
      - name: Export perf report
        if: always()
        shell: bash
        run: |
          {
            echo "## perf export: ${{ github.job }}"
            echo "commit: $(git rev-parse --short HEAD)  time: $(date -u +%FT%TZ)"
            for f in perf-vs-php.md perf-vs-php-nobins.md perf-extra-*.log; do
              [ -f "$f" ] || continue
              echo; echo "### $f"; echo '```'
              cat "$f"
              echo '```'
            done
          } | tee "perf-report-${{ github.job }}.md"
      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-${{ github.job }}
          path: perf-report-${{ github.job }}.md
          if-no-files-found: warn

  # ---------- Linux x86_64 ----------
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang binutils libffi-dev

      - name: Build (build.sh)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Setup PHP (opcache + tracing JIT)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=128M

      - name: Perf vs PHP strongest
        shell: pwsh
        run: ./tools/perf-compare.ps1 -Php php -MaxFibRatio ${{ inputs.fib_gate }} -Report perf-vs-php.md

      - name: Export perf report
        if: always()
        shell: bash
        run: |
          {
            echo "## perf export: ${{ github.job }}"
            echo "commit: $(git rev-parse --short HEAD)  time: $(date -u +%FT%TZ)"
            for f in perf-vs-php.md perf-vs-php-nobins.md perf-extra-*.log; do
              [ -f "$f" ] || continue
              echo; echo "### $f"; echo '```'
              cat "$f"
              echo '```'
            done
          } | tee "perf-report-${{ github.job }}.md"
      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-${{ github.job }}
          path: perf-report-${{ github.job }}.md
          if-no-files-found: warn

  # ---------- Linux aarch64 ----------
  linux-aarch64:
    name: Linux aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang binutils libffi-dev

      - name: Build (build.sh)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Setup PHP (opcache + tracing JIT)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=128M

      # aarch64 v1: tphp IR JIT disabled (x86_64 only) - report-only
      - name: Perf vs PHP strongest
        shell: pwsh
        run: ./tools/perf-compare.ps1 -Php php -Report perf-vs-php.md

      # P0-19 round 4 control: same bench_alloc probes as macos -- growth
      # curves (huge/arena) + steady pairs + getrusage split on Linux 4KB
      # pages give the healthy baseline the mac readings compare against.
      - name: bench_alloc control (steady + growth)
        run: |
          {
            clang -O2 -Ideps/mimalloc/include -Ideps/mimalloc/src tools/bench_alloc.c build/obj/mi_*.o build/obj/mip_*.o -o /tmp/bench_alloc_mi
            clang -O2 -DUSE_LIBC tools/bench_alloc.c -o /tmp/bench_alloc_libc
            echo "=== mimalloc ==="
            /tmp/bench_alloc_mi
            echo "=== libc ==="
            /tmp/bench_alloc_libc
          } 2>&1 | tee perf-extra-alloc.log

      # P0-19 control arm: same NO_BINS pass as macos-aarch64. Linux ELF
      # TLS (initial-exec) is cheap, so this should be ~neutral vs the
      # run above - any large delta here means the toggle itself is not
      # neutral and the mac discrimination is confounded.
      - name: Perf vs PHP strongest (TPHP_NO_BINS=1, control)
        shell: pwsh
        env:
          TPHP_NO_BINS: "1"
        run: ./tools/perf-compare.ps1 -Php php -Report perf-vs-php-nobins.md

      - name: Export perf report
        if: always()
        shell: bash
        run: |
          {
            echo "## perf export: ${{ github.job }}"
            echo "commit: $(git rev-parse --short HEAD)  time: $(date -u +%FT%TZ)"
            for f in perf-vs-php.md perf-vs-php-nobins.md perf-extra-*.log; do
              [ -f "$f" ] || continue
              echo; echo "### $f"; echo '```'
              cat "$f"
              echo '```'
            done
          } | tee "perf-report-${{ github.job }}.md"
      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-${{ github.job }}
          path: perf-report-${{ github.job }}.md
          if-no-files-found: warn

  # ---------- macOS aarch64 (Apple Silicon, native) ----------
  macos-aarch64:
    name: macOS aarch64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # runner profile: CPU model feeds the arm64-mac vs linux-arm
      # comparison (same tphp, gaps there are machine differences)
      - name: Environment (arch/CPU)
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string || true

      - name: Install deps
        run: |
          brew install libffi || true
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Build native arm64 (build.sh)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Setup PHP (opcache + tracing JIT)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=128M

      # aarch64 JIT enabled (2026-10-27). NOTE: macOS runner = M1-class
      # Apple Silicon; gaps vs Linux arm64 (server CPU) are machine
      # differences, not code — e.g. object 32x vs 0.29x is runner skew.
      - name: Perf vs PHP strongest
        shell: pwsh
        run: ./tools/perf-compare.ps1 -Php php -Report perf-vs-php.md

      # P0-19 post-c6294ef framing: the MAIN mac binary is now the CRT
      # default (cluster-1 fix). The comparison pair is CRT (build/tphp)
      # vs mimalloc (USE_MIMALLOC=1 -> build/tphp-mi). Round-4 probes
      # target the 27% kernel time from MIMALLOC_SHOW_STATS (prime
      # suspect: first-touch zero-fill on Darwin 16KB pages -- faults
      # don't care which allocator, compute benches stay healthy).
      # Round-2/3 steps (NO_BINS pass, CRT-vs-main build) are retired:
      # NO_BINS is a no-op on the CRT default and "CRT vs main" is now
      # CRT vs CRT.
      - name: kernel-time attribution (sample, CRT main binary)
        run: |
          {
            ./build/tphp run tools/bench-vs-php.php > /dev/null 2>&1 & P=$!
            sleep 0.3
            sample $P 5 -file /tmp/tphp_sample.txt || true
            wait || true
            sed -n '1,90p' /tmp/tphp_sample.txt || true
          } 2>&1 | tee perf-extra-kernel.log

      - name: mimalloc variant build (USE_MIMALLOC=1 -> build/tphp-mi)
        run: |
          cp build/tphp build/tphp-crt-main    # snapshot CRT: the mi build overwrites build/tphp
          USE_MIMALLOC=1 ./build.sh
          mv build/tphp build/tphp-mi

      - name: mimalloc stats (mi variant)
        run: |
          MIMALLOC_SHOW_STATS=1 ./build/tphp-mi run tools/bench-vs-php.php 2>&1 | grep -vE "^BENCH|^PASS" | tail -70 | tee perf-extra-mimalloc.log || true

      - name: bench_alloc discriminators (steady + growth, mi vs libc)
        run: |
          {
            clang -O2 -Ideps/mimalloc/include -Ideps/mimalloc/src tools/bench_alloc.c build/obj/mi_*.o build/obj/mip_*.o -o /tmp/bench_alloc_mi
            clang -O2 -DUSE_LIBC tools/bench_alloc.c -o /tmp/bench_alloc_libc
            echo "=== mimalloc ==="
            /tmp/bench_alloc_mi
            echo "=== libc ==="
            /tmp/bench_alloc_libc
          } 2>&1 | tee perf-extra-alloc.log

      - name: multi-round mins (CRT vs mimalloc, drop cold first round)
        run: |
          {
            for b in tphp-crt-main tphp-mi; do
              for i in 1 2 3; do
                echo "=== $b round $i ==="
                ./build/$b run tools/bench-vs-php.php 2>&1 | grep -E "^BENCH (serialize|array-push|json|string|alloc-probe|object|real-logstat)" || true
              done
            done
          } 2>&1 | tee perf-extra-rounds.log

      - name: Export perf report
        if: always()
        shell: bash
        run: |
          {
            echo "## perf export: ${{ github.job }}"
            echo "commit: $(git rev-parse --short HEAD)  time: $(date -u +%FT%TZ)"
            for f in perf-vs-php.md perf-vs-php-nobins.md perf-extra-*.log; do
              [ -f "$f" ] || continue
              echo; echo "### $f"; echo '```'
              cat "$f"
              echo '```'
            done
          } | tee "perf-report-${{ github.job }}.md"
      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-${{ github.job }}
          path: perf-report-${{ github.job }}.md
          if-no-files-found: warn

  # ---------- macOS x86_64: cross-compile on arm64 runner ----------
  # REPORT-ONLY by design: arm64 PHP (native) vs x86_64 tphp under
  # Rosetta 2 - arch-mismatched, ratios not comparable. Interpreter
  # threaded dispatch is Rosetta's weak spot (fake 10-50x gaps seen);
  # keep only as a build/run smoke check of the x86_64 codegen.
  macos-x86_64:
    name: macOS x86_64 (cross)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environment (arch/CPU/Rosetta)
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string || true
          sysctl -n sysctl.proc_translated || true

      - name: Install deps
        run: |
          brew install libffi || true
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Cross-compile x86_64 (build.sh TARGET_ARCH=x86_64)
        run: |
          chmod +x build.sh
          TARGET_ARCH=x86_64 ./build.sh

      - name: Verify binary arch
        run: |
          file build/tphp
          file build/tphp | grep -q x86_64

      - name: Setup PHP (opcache + tracing JIT)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=128M

      # cross-arch (arm64 PHP native vs x86_64 tphp under Rosetta) - report-only
      - name: Perf vs PHP strongest
        shell: pwsh
        run: ./tools/perf-compare.ps1 -Php php -Report perf-vs-php.md

      - name: Export perf report
        if: always()
        shell: bash
        run: |
          {
            echo "## perf export: ${{ github.job }}"
            echo "commit: $(git rev-parse --short HEAD)  time: $(date -u +%FT%TZ)"
            for f in perf-vs-php.md perf-vs-php-nobins.md perf-extra-*.log; do
              [ -f "$f" ] || continue
              echo; echo "### $f"; echo '```'
              cat "$f"
              echo '```'
            done
          } | tee "perf-report-${{ github.job }}.md"
      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-${{ github.job }}
          path: perf-report-${{ github.job }}.md
          if-no-files-found: warn

  # ---------- Collect: merge every job's export into ONE artifact ----------
  # Hand the whole run to the analysis session as perf-report-all.md --
  # no manual copy-pasting out of individual job logs.
  collect-report:
    name: Collect perf report (single file)
    needs: [windows-x86_64, linux-x86_64, linux-aarch64, macos-aarch64, macos-x86_64]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download per-job exports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: perf-report-*
          path: reports

      - name: Merge into perf-report-all.md
        run: |
          {
            echo "# TinyPHP perf report - run ${{ github.run_id }}"
            echo "commit: ${{ github.sha }}  time: $(date -u +%FT%TZ)"
            echo
            if [ -d reports ]; then
              find reports -name 'perf-report-*.md' | sort | while read -r f; do
                echo "==================== $f"
                cat "$f"
                echo
              done
            else
              echo "(no per-job exports found)"
            fi
          } > perf-report-all.md
          cat perf-report-all.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-all
          path: perf-report-all.md
          if-no-files-found: warn
