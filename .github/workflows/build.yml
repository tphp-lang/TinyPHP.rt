name: Build

# Manual packaging/export (workflow_dispatch only): builds all five
# platforms and uploads artifacts (binary + libtphp.a + include/).
# Tests run automatically on push via test.yml — not repeated here.
on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- Windows x86_64 (msys2 clang64) ----------
  windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: mingw-w64-clang-x86_64-clang

      - name: Build (build.cmd via msys2 CLANG64)
        shell: msys2 {0}
        run: |
          which clang
          clang --version
          cmd.exe //c build.cmd

      - name: Sanity
        shell: pwsh
        run: ./build/tphp.exe -v

      - name: Export artifact
        uses: actions/upload-artifact@v4
        with:
          name: tphp-windows-x86_64
          path: |
            build/tphp.exe
            build/libtphp.a
            build/include
          if-no-files-found: error

  # ---------- Linux x86_64 ----------
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang binutils

      - name: Build (build.sh)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Sanity
        run: ./build/tphp -v

      - name: Export artifact
        uses: actions/upload-artifact@v4
        with:
          name: tphp-linux-x86_64
          path: |
            build/tphp
            build/libtphp.a
            build/include
          if-no-files-found: error

  # ---------- Linux aarch64 ----------
  linux-aarch64:
    name: Linux aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang binutils

      - name: Build (build.sh)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Sanity
        run: ./build/tphp -v

      - name: Export artifact
        uses: actions/upload-artifact@v4
        with:
          name: tphp-linux-aarch64
          path: |
            build/tphp
            build/libtphp.a
            build/include
          if-no-files-found: error

  # ---------- macOS aarch64 (Apple Silicon, native) ----------
  macos-aarch64:
    name: macOS aarch64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |

      - name: Build native arm64 (build.sh)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Sanity
        run: ./build/tphp -v

      - name: Export artifact
        uses: actions/upload-artifact@v4
        with:
          name: tphp-macos-aarch64
          path: |
            build/tphp
            build/libtphp.a
            build/include
          if-no-files-found: error

  # ---------- macOS x86_64: cross-compile on arm64 runner ----------
  macos-x86_64:
    name: macOS x86_64 (cross)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |

      - name: Cross-compile x86_64 (build.sh TARGET_ARCH=x86_64)
        run: |
          chmod +x build.sh
          TARGET_ARCH=x86_64 ./build.sh

      - name: Verify binary arch
        run: |
          file build/tphp
          file build/tphp | grep -q x86_64

      - name: Sanity
        run: ./build/tphp -v

      - name: Export artifact
        uses: actions/upload-artifact@v4
        with:
          name: tphp-macos-x86_64
          path: |
            build/tphp
            build/libtphp.a
            build/include
          if-no-files-found: error
