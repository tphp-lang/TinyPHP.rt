name: Build

# Manual packaging/export (workflow_dispatch only): builds all five
# platforms and uploads artifacts (binary + libtphp.a + include/ + tcc/).
# tcc comes from tphp-lang/tccbin releases (relocatable compiler pack).
# Tests run automatically on push via test.yml — not repeated here.
on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # tphp-lang/tccbin release tag — bump here when packaging a new tccbin
  TCCBIN_VERSION: v0.0.4
  TCCBIN_BASE: https://github.com/tphp-lang/tccbin/releases/download

jobs:
  # ---------- Windows x86_64 (msys2 clang64) ----------
  windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: mingw-w64-clang-x86_64-clang

      - name: Build (build.cmd via msys2 CLANG64)
        shell: msys2 {0}
        run: |
          which clang
          clang --version
          cmd.exe //c build.cmd

      - name: Sanity
        shell: pwsh
        run: ./build/tphp.exe -v

      - name: Fetch tccbin
        shell: pwsh
        run: |
          $url = "$env:TCCBIN_BASE/$env:TCCBIN_VERSION/tcc-win-x86_64.zip"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile tccbin.zip -UseBasicParsing
          Expand-Archive -Path tccbin.zip -DestinationPath . -Force
          Remove-Item tccbin.zip
          if (-not (Test-Path tcc/tcc.exe)) {
            # zip may be flat (files at root) — normalize into tcc/
            New-Item -ItemType Directory -Force -Path tcc | Out-Null
            Get-ChildItem -File | Where-Object { $_.Name -ne 'tcc' } |
              ForEach-Object { Move-Item $_.FullName tcc/ -Force }
          }
          if (-not (Test-Path tcc/tcc.exe)) { throw "tcc.exe missing after extract" }
          ./tcc/tcc.exe -v

      - name: Export artifact
        uses: actions/upload-artifact@v4
        with:
          name: tphp-windows-x86_64
          path: |
            build/tphp.exe
            build/libtphp.a
            build/include
            tcc
          if-no-files-found: error

  # ---------- Linux x86_64 ----------
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang binutils

      - name: Build (build.sh)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Sanity
        run: ./build/tphp -v

      - name: Fetch tccbin
        run: |
          set -euo pipefail
          url="$TCCBIN_BASE/$TCCBIN_VERSION/tcc-linux-x86_64.zip"
          echo "downloading $url"
          curl -fsSL -o tccbin.zip "$url"
          unzip -q tccbin.zip -d .
          rm -f tccbin.zip
          if [ ! -x tcc/tcc ] && [ ! -f tcc/tcc ]; then
            mkdir -p tcc
            # flat zip: move package files into tcc/
            find . -maxdepth 1 -type f ! -name 'tccbin.zip' -exec mv {} tcc/ \; 2>/dev/null || true
          fi
          test -x tcc/tcc || test -f tcc/tcc
          ./tcc/tcc -v

      - name: Export artifact
        uses: actions/upload-artifact@v4
        with:
          name: tphp-linux-x86_64
          path: |
            build/tphp
            build/libtphp.a
            build/include
            tcc
          if-no-files-found: error

  # ---------- Linux aarch64 ----------
  linux-aarch64:
    name: Linux aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang binutils

      - name: Build (build.sh)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Sanity
        run: ./build/tphp -v

      - name: Fetch tccbin
        run: |
          set -euo pipefail
          url="$TCCBIN_BASE/$TCCBIN_VERSION/tcc-linux-aarch64.zip"
          echo "downloading $url"
          curl -fsSL -o tccbin.zip "$url"
          unzip -q tccbin.zip -d .
          rm -f tccbin.zip
          if [ ! -x tcc/tcc ] && [ ! -f tcc/tcc ]; then
            mkdir -p tcc
            find . -maxdepth 1 -type f ! -name 'tccbin.zip' -exec mv {} tcc/ \; 2>/dev/null || true
          fi
          test -x tcc/tcc || test -f tcc/tcc
          ./tcc/tcc -v

      - name: Export artifact
        uses: actions/upload-artifact@v4
        with:
          name: tphp-linux-aarch64
          path: |
            build/tphp
            build/libtphp.a
            build/include
            tcc
          if-no-files-found: error

  # ---------- macOS aarch64 (Apple Silicon, native) ----------
  macos-aarch64:
    name: macOS aarch64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |

      - name: Build native arm64 (build.sh)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Sanity
        run: ./build/tphp -v

      - name: Fetch tccbin
        run: |
          set -euo pipefail
          url="$TCCBIN_BASE/$TCCBIN_VERSION/tcc-macos-aarch64.zip"
          echo "downloading $url"
          curl -fsSL -o tccbin.zip "$url"
          unzip -q tccbin.zip -d .
          rm -f tccbin.zip
          if [ ! -x tcc/tcc ] && [ ! -f tcc/tcc ]; then
            mkdir -p tcc
            find . -maxdepth 1 -type f ! -name 'tccbin.zip' -exec mv {} tcc/ \; 2>/dev/null || true
          fi
          test -x tcc/tcc || test -f tcc/tcc
          ./tcc/tcc -v

      - name: Export artifact
        uses: actions/upload-artifact@v4
        with:
          name: tphp-macos-aarch64
          path: |
            build/tphp
            build/libtphp.a
            build/include
            tcc
          if-no-files-found: error

  # ---------- macOS x86_64: cross-compile on arm64 runner ----------
  macos-x86_64:
    name: macOS x86_64 (cross)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |

      - name: Cross-compile x86_64 (build.sh TARGET_ARCH=x86_64)
        run: |
          chmod +x build.sh
          TARGET_ARCH=x86_64 ./build.sh

      - name: Verify binary arch
        run: |
          file build/tphp
          file build/tphp | grep -q x86_64

      - name: Sanity
        run: ./build/tphp -v

      - name: Fetch tccbin
        run: |
          set -euo pipefail
          # Package matches the *target* arch of this artifact (x86_64)
          url="$TCCBIN_BASE/$TCCBIN_VERSION/tcc-macos-x86_64.zip"
          echo "downloading $url"
          curl -fsSL -o tccbin.zip "$url"
          unzip -q tccbin.zip -d .
          rm -f tccbin.zip
          if [ ! -x tcc/tcc ] && [ ! -f tcc/tcc ]; then
            mkdir -p tcc
            find . -maxdepth 1 -type f ! -name 'tccbin.zip' -exec mv {} tcc/ \; 2>/dev/null || true
          fi
          test -x tcc/tcc || test -f tcc/tcc
          # Host is arm64; x86_64 tcc may need Rosetta — only check file exists
          file tcc/tcc || true

      - name: Export artifact
        uses: actions/upload-artifact@v4
        with:
          name: tphp-macos-x86_64
          path: |
            build/tphp
            build/libtphp.a
            build/include
            tcc
          if-no-files-found: error
