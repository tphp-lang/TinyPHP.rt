name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Windows x86_64 (msys2 clang64) ----------
  windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: mingw-w64-clang-x86_64-clang

      - name: Build (build.cmd via msys2 CLANG64)
        shell: msys2 {0}
        run: |
          which clang
          clang --version
          cmd.exe //c build.cmd

      - name: Test
        shell: pwsh
        run: ./tests/run.ps1

      - name: Pack smoke (PE resources)
        shell: pwsh
        run: |
          Set-Content -Path asset.txt -Value "asset-data" -NoNewline
          Set-Content -Path app.php -Value '<?php echo file_get_contents(ASSET_ROOT . "/asset.txt"), "\n";' -NoNewline
          ./build/tphp.exe build app.php --with asset.txt -o app.exe
          $out = ./app.exe
          if ("$out" -notmatch 'asset-data') { throw "packed asset not readable" }
          if (Test-Path runtime/lib) { throw "data asset must not hit disk" }
          "asset-in-memory"

      - name: Smoke
        shell: pwsh
        run: |
          ./build/tphp.exe -v
          ./build/tphp.exe test tests/lib

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tphp-windows-x86_64
          path: build/tphp.exe
          if-no-files-found: error

  # ---------- Linux x86_64 ----------
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang binutils libffi-dev

      - name: Build (build.sh)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Test
        shell: pwsh
        run: ./tests/run.ps1

      - name: Pack smoke (ELF section / footer)
        run: |
          printf '%s' 'asset-data' > asset.txt
          printf '%s' '<?php echo file_get_contents(ASSET_ROOT . "/asset.txt"), "\n";' > app.php
          ./build/tphp build app.php --with asset.txt -o app
          ./app > out.txt
          grep -q 'asset-data' out.txt
          test ! -d runtime/lib
          echo "asset-in-memory"

      - name: Smoke
        run: |
          ./build/tphp -v
          ./build/tphp test tests/lib

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tphp-linux-x86_64
          path: build/tphp
          if-no-files-found: error

  # ---------- Linux aarch64 ----------
  linux-aarch64:
    name: Linux aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang binutils libffi-dev

      - name: Build (build.sh)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Test
        shell: pwsh
        run: ./tests/run.ps1

      - name: Pack smoke (ELF section / footer)
        run: |
          printf '%s' 'asset-data' > asset.txt
          printf '%s' '<?php echo file_get_contents(ASSET_ROOT . "/asset.txt"), "\n";' > app.php
          ./build/tphp build app.php --with asset.txt -o app
          ./app > out.txt
          grep -q 'asset-data' out.txt
          test ! -d runtime/lib
          echo "asset-in-memory"

      - name: Smoke
        run: |
          ./build/tphp -v
          ./build/tphp test tests/lib

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tphp-linux-aarch64
          path: build/tphp
          if-no-files-found: error

  # ---------- macOS aarch64 (Apple Silicon, native) ----------
  macos-aarch64:
    name: macOS aarch64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew install libffi || true
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Build native arm64 (build.sh)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Test
        shell: pwsh
        run: ./tests/run.ps1

      - name: Pack smoke (footer container)
        run: |
          printf '%s' 'asset-data' > asset.txt
          printf '%s' '<?php echo file_get_contents(ASSET_ROOT . "/asset.txt"), "\n";' > app.php
          ./build/tphp build app.php --with asset.txt -o app
          ./app > out.txt
          grep -q 'asset-data' out.txt
          test ! -d runtime/lib
          echo "asset-in-memory"

      - name: Smoke
        run: |
          ./build/tphp -v
          ./build/tphp test tests/lib

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tphp-macos-aarch64
          path: build/tphp
          if-no-files-found: error

  # ---------- macOS x86_64: cross-compile on arm64 runner ----------
  macos-x86_64:
    name: macOS x86_64 (cross)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew install libffi || true
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Cross-compile x86_64 (build.sh TARGET_ARCH=x86_64)
        run: |
          chmod +x build.sh
          TARGET_ARCH=x86_64 ./build.sh

      - name: Verify binary arch
        run: |
          file build/tphp
          file build/tphp | grep -q x86_64

      - name: Test (Rosetta 2)
        shell: pwsh
        run: ./tests/run.ps1

      - name: Smoke
        run: |
          ./build/tphp -v
          ./build/tphp test tests/lib

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tphp-macos-x86_64
          path: build/tphp
          if-no-files-found: error
